name: release

# Publish the six workspace packages (lockstep) to npmjs.
# Version bumps / dep updates happen in a prior manual commit — this workflow
# builds and publishes whatever version is committed on the branch it runs from.
#
#   branch      npm dist-tag
#   main        dev     (0.1.0-dev.N — MUST NOT take `latest`: it is semver-above
#                        the production 0.0.x line and would steal the tag)
#   production  latest  (stable 0.0.x)

on:
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC): no NPM_TOKEN, no 2FA prompt, provenance included
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The publishing workspace root is packages/ — running pnpm publish -r from
    # the repo root would sweep examples/, sandbox/ and prototypes/ too.
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v6

      - name: Resolve dist-tag from branch
        id: meta
        run: |
          case "${{ github.ref_name }}" in
            main)       echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
            production) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release runs from main or production only (got ${{ github.ref_name }})"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # no registry-url: setup-node would write a placeholder NODE_AUTH_TOKEN
          # into .npmrc, which npm sends instead of the trusted-publishing token

      # packages/pnpm-lock.yaml is gitignored — nothing to freeze against.
      - name: Install workspace
        run: pnpm install

      - name: Build
        run: pnpm -r run build

      # pnpm pack rewrites workspace:/catalog: ranges to real versions; npm
      # publishes the tarballs because pnpm's OIDC token exchange fails (404)
      # against npm trusted publishing. Versions already on the registry are
      # skipped, so reruns are idempotent.
      - name: Pack (all six packages, lockstep)
        run: pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Publish with npm trusted publishing
        env:
          NODE_AUTH_TOKEN: ""
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          npm install -g npm@11
          npm --version
          # dependencies first, so no published package points at a missing one
          for n in ph-clint ph-clint-app ph-clint-dev ph-clint-observability clint-common ph-clint-cli; do
            t=$(ls "$RUNNER_TEMP"/tarballs/powerhousedao-$n-[0-9]*.tgz)
            name=$(tar -xzOf "$t" package/package.json | node -p 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.name+"@"+j.version')
            if npm view "$name" version >/dev/null 2>&1; then
              echo "skip $name (already published)"
            else
              npm publish "$t" --access public --tag "$TAG" --loglevel verbose 2>&1 | grep -E "oidc|npm (error|notice) (code|Publishing|\\+)|^\\+ " || true
              npm view "$name" version >/dev/null 2>&1 && echo "published $name" || { echo "::error::failed $name"; failed=1; }
            fi
          done
          [ -z "${failed:-}" ]

      - name: Verify dist-tags
        run: |
          sleep 10
          for p in ph-clint ph-clint-dev ph-clint-observability ph-clint-app ph-clint-cli clint-common; do
            echo "== @powerhousedao/$p"
            npm view "@powerhousedao/$p" dist-tags --registry https://registry.npmjs.org || true
          done
